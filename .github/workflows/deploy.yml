name: Build and deploy to GitHub Pages

# Publishes the site via GitHub Actions instead of GitHub Pages' old
# "deploy straight from the branch" mode, specifically so the three main
# HTML pages can be minified on the way out without touching the
# committed source - see lighthousetodo.txt (26/07/2026) for the numbers
# that motivated this: minifying index.html cut its gzip'd payload from
# ~71KB to ~25KB (65%), add-shoot.html from ~34KB to ~18KB (47%). The
# committed *.html files are the real, editable, fully-commented source -
# this workflow's output is a disposable build artifact, never written
# back to the repo.
#
# Deliberately builds an explicit `_site` directory from exactly the
# tracked files (`git ls-files`) rather than uploading the whole checkout
# root - the checkout also contains .git internals that must never be
# published, and this way the deployed file set is guaranteed to match
# git's own idea of what belongs in the repo, not whatever happens to be
# sitting in the runner's working directory.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push should win rather
# than queuing behind an older one still in flight.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assemble _site from tracked files
        run: |
          mkdir _site
          git ls-files -z | xargs -0 -I{} cp --parents {} _site/

      - name: Minify the three main HTML pages
        # CONFIRMED BUG (26/07/2026): --remove-redundant-attributes used to
        # be here too - it strips type="text" from <input> tags (the HTML
        # spec's own default, so technically "redundant" from a pure-HTML
        # standpoint). But every themed input across all three pages relies
        # on CSS attribute selectors like `.field input[type="text"]`,
        # which require that literal attribute to actually be present in
        # the DOM - the browser does NOT reinstate a default type="text"
        # attribute just because it applies the default type="text"
        # BEHAVIOUR. The result: every plain-text input on the live
        # (minified) site silently fell back to completely unstyled
        # browser-default rendering (~20-character intrinsic width, no
        # theme colours, default border) while the exact same page tested
        # locally against the raw, unminified source looked completely
        # normal - this flag only ever ran in this pipeline, never in local
        # testing, which is exactly why it went unnoticed through several
        # rounds of otherwise-thorough verification. Diagnosed from a real
        # user screenshot showing one input a fraction of its neighbour's
        # width, confirmed by diffing the live deployed HTML directly:
        # every type="text" input was missing its type attribute; type=
        # "email"/"datetime-local" (not "redundant", so untouched) were
        # fine throughout. Removed the flag rather than reworking every
        # affected CSS selector across three files - the few bytes it saved
        # were never worth this. Script/style type attributes are still
        # stripped via their own separate, unaffected flags below.
        run: |
          npx --yes html-minifier-terser@7 \
            --collapse-whitespace --remove-comments \
            --minify-css true --minify-js true \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            -o _site/index.html _site/index.html
          npx --yes html-minifier-terser@7 \
            --collapse-whitespace --remove-comments \
            --minify-css true --minify-js true \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            -o _site/add-shoot.html _site/add-shoot.html
          npx --yes html-minifier-terser@7 \
            --collapse-whitespace --remove-comments \
            --minify-css true --minify-js true \
            --remove-script-type-attributes \
            --remove-style-link-type-attributes \
            -o _site/become-photographer.html _site/become-photographer.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
